<style>
  :root { --bg:#f4fafb; --ink:#10343f; --muted:#456068; --card:#fff; --line:#cfe0e4; --link:#0d6a86; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1a1e; --ink:#e3f1f4; --muted:#9db6bd; --card:#15262b; --line:#27414a; --link:#7fd0e6; }
  }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui, sans-serif; }
  main { max-width:44rem; margin:0 auto; padding:1rem 16px 3rem; }
  a { color:var(--link); }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1rem 1.25rem; margin:1rem 0; }
  h1 { font-size:1.8rem; margin:1rem 0 .25rem; }
  h2 { font-size:1.2rem; margin:.2rem 0; }

    <p><a href="number-spin/#en">Privacy policy (English)</a> · <a href="number-spin/#vi">Chính sách quyền riêng tư (Tiếng Việt)</a></p>
